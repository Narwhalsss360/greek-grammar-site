<!DOCTYPE html>
<html>
  <head>
    <title>Greek Grammar Site</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <script src="./index.js" defer></script>
    <div id="menu-bar" class="sidebar" style="display: none;">
      <button onclick="exportVerbs()">Export</button>
    </div>

    <div id="new-bar" class="sidebar right-side" style="display: none;">
      <select id="new-verb-group" style="margin-bottom: 6px;">
        <option>A1</option>
        <option>A2</option>
        <option>B1</option>
        <option>B2</option>
        <option>Passive 1</option>
        <option>Passive 2</option>
      </select>

      <input id="new-verb-stem" type="text" placeholder="Enter Verb Stem" style="margin-bottom: 6px;">

      <button onclick="addClick()">Add</button>
    </div>

    <header>
      <button style="margin-left: 10px;" onclick="menuClick()">Menu</button>
      <h1 style="margin: 0px 5px 0px 5px; justify-self: center;">Greek Verbs</h1>
      <button style="margin-right: 10px" onclick="newClick()">New</button>
    </header>

    <div id="main-content" class="main-content"></div>

    <div id="error-modal" class="error-modal" style="display: none;">
      <p id="error-modal-p" style="align-self: center;"></p>
      <button onclick="closeErrorBox()" style="background-color: black;">Close</button>
    </div>

    <footer>
      <div></div>
      <h3 style="margin: 0px 5px 0px 5px; justify-self: center;">Author: Franklyn Vasquez</h3>
      <div></div>
    </footer>
  </body>
</html>
