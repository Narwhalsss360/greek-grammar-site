<!DOCTYPE html>
<html>
  <head>
    <title>Greek Grammar Site</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <script src="./index.js" defer></script>
    <div id="menu-bar" class="sidebar" style="display: flex;">
      <label for="import-file" class="file-upload-label">Import</label>
      <input type="file" id="import-file" style="padding: 4px;">
      <button onclick="exportVerbs()">Export</button>
    </div>

    <div id="new-bar" class="sidebar right-side" style="display: none;">
      <select id="new-verb-group" style="margin-bottom: 6px;">
        <option>A1</option>
        <option>A2</option>
        <option>B1</option>
        <option>B2</option>
        <option>Passive 1</option>
        <option>Passive 2</option>
      </select>

      <input id="new-verb-stem" type="text" placeholder="Enter Verb Stem" style="margin-bottom: 6px;">

      <button onclick="addClick()">Add</button>
    </div>

    <header>
      <button style="margin-left: 10px;" onclick="menuClick()">Menu</button>
      <h1 style="margin: 0px 5px 0px 5px; justify-self: center;">Greek Verbs</h1>
      <button style="margin-right: 10px" onclick="newClick()">New</button>
    </header>

    <div id="main-content" class="main-content"></div>

    <div id="exceptions-modal" class="exceptions-modal" style="display: none;">
      <div style="display: flex; flex-direction: column; width: 75%; align-self: center;">
        <h4 id="exception-verb-id" style="align-self: center; margin: 10px 0px 6px 0px;">GROUP:STEM</h4>
        <select id="exception-grammatical-form-select" style="margin: 0px 0px 6px 0px;">
          <option value="singular">Singluar</option>
          <option value="plural">Plural</option>
        </select>
        <select id="exception-grammatical-count-select" style="margin: 0px 0px 6px 0px;">
          <option value="first">1st Person</option>
          <option value="second">2nd Person</option>
          <option value="third">3rd Person</option>
        </select>
        <input id="exception-input" style="margin: 0px 0px 10px 0px" type="text" placeholder="Enter Exception">
      </div>
      <div style="display: flex;">
        <button class="exceptions-modal-cancel-button" onclick="cancelException()">Cancel</button>
        <button class="exceptions-modal-save-button" onclick="saveException()">Save</button>
      </div>
    </div>

    <div id="error-modal" class="error-modal" style="display: none;">
      <p id="error-modal-p" style="align-self: center; margin: 12px;">Error:</p>
      <button onclick="closeErrorBox()" style="background-color: black;">Close</button>
    </div>

    <footer>
      <div></div>
      <h3 style="margin: 0px 5px 0px 5px; justify-self: center;">Author: Franklyn Vasquez</h3>
      <div></div>
    </footer>
  </body>
</html>
